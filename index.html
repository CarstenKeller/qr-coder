<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>QR-Coder</title>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm11-2h2v2h-2v-2zm-3 0h2v3h-2v-3zm5 3h3v2h-3v-2zm-5 2h3v3h-3v-3zm5 2h3v1h-3v-1zm1-7h2v2h-2v-2z"/></svg>
    <div>
      <h1 id="app-title">QR-Coder</h1>
      <p id="app-tagline" class="tagline"></p>
    </div>
  </div>
  <div class="actions">
    <!-- Design D-01: Aktionen als Icon mit Tooltip -->
    <button id="btn-open" type="button" class="icon-btn" data-icon="folder" data-tip-key="tip.open"></button>
    <input id="open-file" type="file" accept=".svg,image/svg+xml,image/png,image/jpeg,image/webp" hidden>
    <button id="btn-reset" type="button" class="icon-btn" data-icon="reset" data-tip-key="tip.reset"></button>
    <div class="menu-wrap">
      <button id="btn-theme" type="button" class="icon-btn" data-icon="theme" data-tip-key="tip.theme" aria-haspopup="true" aria-expanded="false" aria-controls="theme-menu"></button>
      <div id="theme-menu" class="menu" role="radiogroup" hidden></div>
    </div>
  </div>
</header>

<main class="layout">
  <section class="preview-pane" aria-live="polite">
    <div class="card preview-card">
      <div id="preview" class="preview"></div>
      <div id="scan" class="scan" data-state="idle">
        <span class="dot" aria-hidden="true"></span><span id="scan-text"></span>
      </div>
      <p id="scan-note" class="note"></p>
      <p id="info" class="note"></p>
      <ul id="warnings" class="warnings"></ul>
      <div class="export-bar">
        <button id="btn-svg" type="button" class="icon-btn primary" data-icon="download" data-tip-key="tip.svg"><span class="badge">SVG</span></button>
        <button id="btn-png" type="button" class="icon-btn" data-icon="image" data-tip-key="tip.png"><span class="badge">PNG</span></button>
        <button id="btn-copy" type="button" class="icon-btn" data-icon="copy" data-tip-key="tip.copy"></button>
        <div class="menu-wrap">
          <button id="btn-share" type="button" class="icon-btn" data-icon="share" data-tip-key="tip.share" aria-haspopup="true" aria-expanded="false"></button>
          <div id="share-menu" class="menu menu-up" hidden></div>
        </div>
        <label class="size-field"><span data-i18n="export.size"></span>
          <input id="export-size" type="number" min="16" max="8192" step="16" inputmode="numeric"></label>
      </div>
    </div>
  </section>

  <section class="controls-pane">
    <h2 class="sr" data-i18n="presets"></h2>
    <div id="presets" class="presets" role="list"></div>
    <div id="controls"></div>
  </section>
</main>

<footer class="footer">
  <p data-i18n="footer"></p>
  <p class="small" data-i18n="footer.licenses"></p>
</footer>

<!-- Mini-Vorschau beim Scrollen (abschaltbar, wieder einschaltbar im Menü "Darstellung") -->
<div id="mini-preview" class="mini" data-state="idle" hidden>
  <button id="mini-open" type="button" class="mini-open" data-tip-key="mini.open">
    <span id="mini-svg" class="mini-svg"></span>
    <span class="mini-dot" aria-hidden="true"></span>
  </button>
  <button id="mini-close" type="button" class="icon-btn small mini-close" data-icon="close" data-tip-key="mini.close"></button>
</div>

<!-- Betrachter für gespeicherte Codes -->
<dialog id="viewer" class="viewer" aria-labelledby="viewer-name">
  <div class="viewer-head">
    <div class="viewer-title"><strong id="viewer-name"></strong> <span id="viewer-size" class="note"></span></div>
    <button id="viewer-close" type="button" class="icon-btn small" data-icon="close" data-tip-key="viewer.close"></button>
  </div>
  <div class="viewer-img-wrap"><img id="viewer-img" alt=""></div>
  <div id="viewer-result" class="viewer-result" data-state="idle">
    <span class="label" data-i18n="viewer.content"></span>
    <code id="viewer-text"></code>
  </div>
  <div class="viewer-actions">
    <span id="viewer-actions" class="row" hidden>
      <button id="viewer-copy" type="button" class="icon-btn" data-icon="copy" data-tip-key="viewer.copy"></button>
      <a id="viewer-link" class="icon-btn" data-icon="open" data-tip-key="viewer.openlink" target="_blank" rel="noopener noreferrer" hidden></a>
    </span>
    <button id="viewer-edit" type="button" class="icon-btn primary" data-icon="edit" data-tip-key="viewer.edit" hidden><span class="badge" data-i18n="viewer.editShort"></span></button>
  </div>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>

<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="vendor/zxing-reader.js"></script>
<script src="vendor/zxing-reader-wasm.js"></script>
<script src="src/i18n.js"></script>
<script src="src/content.js"></script>
<script src="src/render.js"></script>
<script src="src/app.js"></script>
</body>
</html>
